# Tushare Pro —— 纯 YAML 自定义数据源(docs/custom-data-source.md 路线)
#
# 覆盖数据集: daily(A股日K) / adj_factor(A股除权因子) / minute(A股/ETF/指数分钟K)
#            / full_minute(全量分钟: 盘中全市场当日 1 分钟K 落盘)
#            / financial(财务: 利润表/资产负债表/现金流量表/财务指标, 可选历史股本)
#   未声明的数据集(实时行情/五档)自动回退 TickFlow。
#   ETF/指数**日K**未覆盖(Tushare 需换 fund_daily/index_daily 接口, 一个数据集只有
#   一个 url/body 模板); 需要时请把这两个数据集的日K路由到 TickFlow。
#
# Key: 复用 .env / 环境变量 TUSHARE_API_KEY(auth.type=body → 注入 POST 请求体, 参数名 token)
#
# 协议要点(均经实测, 详见 docs/custom-data-source.md「上游响应形状」「请求模板」两节):
#   - token 必须在请求体, 放查询串/请求头会返回 code=40101;
#   - 业务参数必须嵌套在 body.params 下, 顶层平铺会被忽略;
#   - ts_code 必须是逗号串(数组会被当无数据); 日期只认紧凑 YYYYMMDD
#     (短横/ISO 都返回 code=0 但 0 行 —— 静默无数据, 最易踩);
#   - 响应是列式信封 data.fields + data.items, 由本项目按字段名解包;
#   - 日K amount 单位为千元(需 *1000), 分钟 vol 单位为股(需 /100);
#   - 分钟接口 `stk_mins` 单请求 **8000 行硬上限**: 超出是静默截断且丢最旧(实测 20 标的
#     跨 2 日应回 9640 行, 实得恰好 8000 行) —— 所以 batch 要按「交易日数 × 241 根/股」折算,
#     多日窗口请调小 batch 或改成两段拉取; full_minute 只拉当日窗口, batch=20 天然安全;
#   - 全量分钟一轮 = 全市场(≈5400) / batch 20 ≈ 270 个请求; 实测该 key 连续 300 次调用
#     无配额报错(36s), rpm=240 下一轮 ≈ 70s, 与服务的仅修复轮节奏下限(60s)匹配;
#   - 财务接口: income/balancesheet/cashflow/daily_basic **不支持多标的**(逗号串静默 0 行),
#     fina_indicator 可以; 且部分接口单次约 100 期上限(≈25 年季报, 足够回测用)。
#   - ts_code 只认「6 位代码.交易所大写后缀」(600000.SH / 000001.SZ / 920002.BJ):
#     600000 / sh600000 / 600000.XSHG / 600000.sz 实测均返回 code=0 但 0 行(静默无数据)。
#     内部 symbol 已是该格式, ${symbols} 直接逗号拼接即可。

name: tushare_api
display_name: "Tushare (HTTP 自定义源)"

auth:
  type: body
  param: token
  token_env: TUSHARE_API_KEY

datasets:
  daily:
    url: http://api.tushare.pro
    method: POST
    batch: 20            # 单请求标的数: 接口单次 6000 行上限, 按窗口交易日数留余量
    rpm: 240             # 接口按积分等级限频, 此处保守自限速
    timeout: 30
    response_path: data
    body:
      api_name: daily
      fields: "ts_code,trade_date,open,high,low,close,vol,amount"
      params:
        ts_code: "${symbols}"
        start_date: "${start:%Y%m%d}"
        end_date: "${end:%Y%m%d}"
    field_map:
      ts_code: symbol
      trade_date: date
      open: open
      high: high
      low: low
      close: close
      vol: volume
      amount: amount
    transforms:
      date: "parse_date(value, '%Y%m%d')"
      amount: "value * 1000"    # 千元 → 元

  adj_factor:
    url: http://api.tushare.pro
    method: POST
    batch: 20
    rpm: 240
    timeout: 30
    response_path: data
    adj_factor_mode: cumulative   # 上游给累积因子 → 本项目换算为单事件比值
    body:
      api_name: adj_factor
      fields: "ts_code,trade_date,adj_factor"
      params:
        ts_code: "${symbols}"
        start_date: "${start:%Y%m%d}"
        end_date: "${end:%Y%m%d}"
    field_map:
      ts_code: symbol
      trade_date: trade_date
      adj_factor: ex_factor
    transforms:
      trade_date: "parse_date(value, '%Y%m%d')"

  minute:
    url: http://api.tushare.pro
    method: POST
    batch: 20            # 单请求标的数: 接口单次 8000 行上限(单日 1min ≈ 241 根/股)
    rpm: 240
    timeout: 30
    response_path: data
    body:
      api_name: stk_mins
      fields: "ts_code,trade_time,open,high,low,close,vol,amount"
      params:
        ts_code: "${symbols}"
        freq: 1min
        start_date: "${start:%Y-%m-%d %H:%M:%S}"
        end_date: "${end:%Y-%m-%d %H:%M:%S}"
    field_map:
      ts_code: symbol
      trade_time: datetime
      open: open
      high: high
      low: low
      close: close
      vol: volume
      amount: amount
    transforms:
      datetime: "parse_datetime(value, '%Y-%m-%d %H:%M:%S')"
      volume: "value / 100"     # 股 → 手

  # 全量分钟(doc_id=370 股票历史分钟行情 = stk_mins, 与 minute 同源接口)。
  # 声明后即可在「设置 → 数据源 → 全量分钟」把它选为生效源: 盘中服务按当日窗口
  # (00:00 → 现在, 北京墙钟)分批拉全市场分钟K 并幂等写入 data/kline_minute/。
  # YAML 声明式源不提供 get_intraday_latest 廉价增量端点 → 服务自动降级为「仅修复轮」
  # (节奏下限 60s), 数据不丢(每次都是当日全量幂等覆盖)。
  full_minute:
    url: http://api.tushare.pro
    method: POST
    batch: 20            # 20 × 241 根 ≈ 4820 行, 留足 8000 行上限余量(超限静默丢最旧)
    rpm: 240             # 全市场一轮 ≈ 270 请求 ≈ 70s; 实测配额允许更高, 这里与服务节奏对齐
    timeout: 30
    response_path: data
    body:
      api_name: stk_mins
      fields: "ts_code,trade_time,open,high,low,close,vol,amount"
      params:
        ts_code: "${symbols}"
        freq: 1min
        start_date: "${start:%Y-%m-%d %H:%M:%S}"   # 修复轮窗口: 当日 00:00
        end_date: "${end:%Y-%m-%d %H:%M:%S}"       # → 现在
    field_map:
      ts_code: symbol
      trade_time: datetime
      open: open
      high: high
      low: low
      close: close
      vol: volume
      amount: amount
    transforms:
      datetime: "parse_datetime(value, '%Y-%m-%d %H:%M:%S')"
      volume: "value / 100"     # 股 → 手

  financial:
    url: http://api.tushare.pro
    method: POST
    batch: 1             # income/balancesheet/cashflow/daily_basic 不支持多标的(实测逗号串 0 行)
    rpm: 400             # 实测各财务接口配额 = 500 次/分钟(fina_indicator/income/balancesheet/cashflow
                         # 均在 500~571 次时返回 code=40203 频率超限), 留 20% 余量。
                         # batch=1 下 rate 即吞吐: 5568 只标的 ≈ 14 分钟/表(240 时是 32 分钟/表)
    timeout: 30
    response_path: data
    table_map:           # 内部表名 → Tushare 接口名(经 ${table} 注入 body.api_name)
      metrics: fina_indicator
      income: income
      balance_sheet: balancesheet
      cash_flow: cashflow
      # shares 默认不开: Tushare 无「按报告期」的股本接口, 只能用 daily_basic 按交易日取
      # (单标的 6000 行/次, 全 A 约 3000 万行 → 不适合默认每次同步跑)。
      # 需要历史流通股本(回测换手率)时加一行 `shares: daily_basic` 即可 —— 下方 fields/
      # field_map/transforms 已备好 trade_date → period_end 与 float_share(万股) → float_shares(股)。
    body:
      api_name: "${table}"
      # 并集字段: 各接口忽略自己不存在的字段(实测), 故一份清单通吃各表
      fields: >-
        ts_code,trade_date,ann_date,end_date,basic_eps,total_revenue,revenue,oper_cost,sell_exp,
        admin_exp,rd_exp,fin_exp,operate_profit,total_profit,income_tax,n_income,n_income_attr_p,
        total_cur_assets,total_nca,money_cap,accounts_receiv,total_assets,total_liab,
        total_hldr_eqy_exc_min_int,n_cashflow_act,n_cashflow_inv_act,n_cash_flows_fnc_act,
        c_pay_acq_const_fiolta,n_incr_cash_cash_equ,eps,bps,roe_waa,roa,grossprofit_margin,
        netprofit_margin,debt_to_assets,or_yoy,netprofit_yoy,float_share
      params:
        ts_code: "${symbols}"
    # 金额类字段单位为元、指标类为百分数, 与内部口径一致, 不需换算;
    # 只有股本需 万股 → 股 (daily_basic.total_share 与 balancesheet.total_share 单位不同,
    # 故此处只映射 daily_basic 独有的 float_share, 避开同名冲突)。
    field_map:
      ts_code: symbol
      end_date: period_end
      ann_date: announce_date
      trade_date: period_end        # 仅 daily_basic 有(历史股本按交易日归属)
      basic_eps: basic_eps
      total_revenue: total_revenue
      revenue: revenue
      oper_cost: operating_cost
      sell_exp: selling_expense
      admin_exp: admin_expense
      rd_exp: rd_expense
      fin_exp: financial_expense
      operate_profit: operating_profit
      total_profit: total_profit
      income_tax: income_tax
      n_income: net_income
      n_income_attr_p: net_income_attributable
      total_cur_assets: total_current_assets
      total_nca: total_non_current_assets
      money_cap: cash_and_equivalents
      accounts_receiv: accounts_receivable
      total_assets: total_assets
      total_liab: total_liabilities
      total_hldr_eqy_exc_min_int: total_equity
      n_cashflow_act: net_operating_cash_flow
      n_cashflow_inv_act: net_investing_cash_flow
      n_cash_flows_fnc_act: net_financing_cash_flow
      c_pay_acq_const_fiolta: capex
      n_incr_cash_cash_equ: net_cash_change
      eps: eps_basic
      bps: bps
      roe_waa: roe
      roa: roa
      grossprofit_margin: gross_margin   # 注意: 用 grossprofit_margin(率), 不是 gross_margin(毛利额)
      netprofit_margin: net_margin       # 同理: netprofit_margin 是净利率
      debt_to_assets: debt_to_asset_ratio
      or_yoy: revenue_yoy
      netprofit_yoy: net_income_yoy
      float_share: float_shares
    transforms:
      period_end: "parse_date(value, '%Y%m%d')"
      announce_date: "parse_date(value, '%Y%m%d')"
      float_shares: "value * 10000"   # daily_basic 单位为万股 → 股

# Tushare Pro — 官方金融数据 API 插件 (https://tushare.pro)
# 纯 HTTP 直连 api.tushare.pro, 无额外依赖 (runtime: none, 不需要 pip install tushare)。
# 需在 .env 或环境变量配置 TUSHARE_API_KEY, 未配置时插件灰显不可切换。

name: tushare
display_name: "Tushare"
runtime: none
entry: app.plugins.tushare.provider:TushareProvider
check: app.plugins.tushare.provider:availability
datasets: [daily, adj_factor, minute, financial]
api_key_env: TUSHARE_API_KEY   # 声明后设置页提供 Key 输入框(先探后存, secrets.json 优先)
description: "Tushare Pro 官方 HTTP 数据 API。日K覆盖 A 股(daily)/ETF(fund_daily)/指数(index_daily), 不复权原始价; 除权因子 A 股(adj_factor)/ETF(fund_adj), 累积因子已换算为项目「单事件比值」口径; 分钟K(stk_mins, 1/5/15/30/60min, 股票/ETF/指数, 历史可回溯多年); 财务四表(metrics=fina_indicator / income / balance_sheet / cash_flow, 按标的逐只请求, 金额单位元、指标百分数, 报告期按 (symbol, period_end) 唯一); 标的维表含股本(供换手率)。实时行情(Tushare 无全市场快照)、五档盘口、全量分钟(stk_mins 只能按标的拉, 无全市场批量端点)未接入, 自动回退 TickFlow。接口按积分等级限频, 插件侧自限速 400 次/分钟。"
install_hint: "点击卡片中的输入框配置 API Key(https://tushare.pro 注册后于「个人主页 → 接口 TOKEN」获取),或在 .env 中配置 TUSHARE_API_KEY"
homepage: "https://tushare.pro"
